apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: checkpointpolicies.mncr.io
spec:
  group: mncr.io
  scope: Namespaced
  names:
    plural: checkpointpolicies
    singular: checkpointpolicy
    kind: CheckpointPolicy
    shortNames: [ckpolicy]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Job
          type: string
          jsonPath: .spec.jobId
        - name: Interval
          type: integer
          jsonPath: .spec.intervalSeconds
        - name: Last
          type: string
          jsonPath: .status.lastCheckpointAt
        - name: Failures
          type: integer
          jsonPath: .status.consecutiveFailures
        - name: Suspended
          type: boolean
          jsonPath: .status.suspended
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [jobId, intervalSeconds]
              properties:
                jobId:
                  type: string
                intervalSeconds:
                  type: integer
                  minimum: 60
                  description: >-
                    Interval rather than cron. A checkpoint that starts while the
                    previous image is still uploading is worse than a late one.
                retain:
                  type: integer
                  default: 3
                  description: Images to keep before evicting the oldest.
                suspendAfterFailures:
                  type: integer
                  default: 3
            status:
              type: object
              properties:
                lastEpochId:
                  type: string
                lastCheckpointAt:
                  type: string
                lastAttemptAt:
                  type: string
                lastError:
                  type: string
                consecutiveFailures:
                  type: integer
                retainedImages:
                  type: integer
                suspended:
                  type: boolean
                  description: >-
                    Set once consecutiveFailures reaches suspendAfterFailures.
                    Clear it by hand once the cause is fixed; retrying a broken
                    policy turns one job into load on every node it touches.
                suspendedReason:
                  type: string
