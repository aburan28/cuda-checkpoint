apiVersion: v1
kind: Namespace
metadata:
  name: mncr-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mncr-agent
  namespace: mncr-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mncr-coordinator
  namespace: mncr-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mncr-agent
rules:
  # The agent reads node labels to report its own capability, and pods to map
  # containers onto host pids. It writes nothing to the API.
  - apiGroups: [""]
    resources: [nodes, pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mncr-coordinator
rules:
  - apiGroups: [""]
    resources: [nodes, pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [delete]          # checkpoint-and-stop
  - apiGroups: [mncr.io]
    resources: [gpucheckpoints, gpurestores, checkpointpolicies]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [mncr.io]
    resources:
      [gpucheckpoints/status, gpurestores/status, checkpointpolicies/status]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mncr-agent
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: mncr-agent}
subjects:
  - kind: ServiceAccount
    name: mncr-agent
    namespace: mncr-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mncr-coordinator
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: mncr-coordinator}
subjects:
  - kind: ServiceAccount
    name: mncr-coordinator
    namespace: mncr-system
