apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: mncr-checkpointable
webhooks:
  - name: checkpointable.mncr.io
    admissionReviewVersions: [v1]
    sideEffects: None
    # Never block unrelated workloads: only pods that opt in are evaluated, and
    # a webhook outage must not stop the cluster scheduling ordinary pods.
    failurePolicy: Ignore
    objectSelector:
      matchLabels:
        mncr.io/checkpointable: "true"
    rules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
    clientConfig:
      service:
        name: mncr-admission
        namespace: mncr-system
        path: /validate
        port: 443
